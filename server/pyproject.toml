]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "ruff (>=0.17.3,<0.18.0)"
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
